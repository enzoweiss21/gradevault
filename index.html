<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GradeVault — End-to-end encrypted academic records</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 140'><path d='M 32 56 V 40 a 28 28 0 0 1 56 0 V 56 H 72 V 40 a 12 12 0 0 0 -24 0 V 56 Z' fill='%230a1d3f'/><rect x='12' y='56' width='96' height='78' rx='14' fill='%230a1d3f'/><circle cx='60' cy='90' r='14' fill='%23e23f3a'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper:   #ffffff;
    --paper-2: #f5f1ea;
    --paper-3: #ebe5d8;
    --ink:     #0a1226;
    --ink-soft:#5b6477;
    --line:    #d9d3c5;

    --navy:    #0a1d3f;
    --navy-2:  #0e2654;
    --coral:   #e23f3a;
    --coral-2: #ffd9d6;
    --gold:    #d8a541;
    --ok:      #1c8a5b;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: 'Manrope', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  .serif { font-family: 'Instrument Serif', 'Times New Roman', serif; font-weight: 400; letter-spacing: -0.012em; }
  .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  a { color: inherit; }
  button { font-family: inherit; }
  ::selection { background: var(--coral); color: var(--paper); }

  .container { max-width: 1320px; margin: 0 auto; padding: 0 32px; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .eyebrow {
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--coral);
    letter-spacing: -0.005em;
  }

  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 28px;
    font-family: 'Manrope', sans-serif;
    font-size: 15px; font-weight: 600;
    letter-spacing: -0.005em;
    border: 1.5px solid var(--ink);
    background: var(--ink); color: var(--paper);
    border-radius: 999px;
    cursor: pointer;
    transition: background 160ms ease, color 160ms ease, border-color 160ms ease, transform 100ms ease;
    text-decoration: none;
  }
  .btn:hover { background: var(--coral); border-color: var(--coral); color: var(--paper); }
  .btn:active { transform: translateY(1px); }
  .btn-ghost { background: transparent; color: var(--ink); }
  .btn-ghost:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn-on-dark { border-color: var(--paper); background: transparent; color: var(--paper); }
  .btn-on-dark:hover { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .btn-coral { background: var(--coral); border-color: var(--coral); color: var(--paper); }
  .btn-coral:hover { background: var(--ink); border-color: var(--ink); }

  nav.top {
    position: sticky; top: 0; z-index: 50;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  nav.top .row { display: flex; align-items: center; justify-content: space-between; height: 84px; }
  nav.top .links { display: flex; gap: 36px; font-size: 15px; color: var(--ink); font-weight: 500; }
  nav.top .links a { text-decoration: none; transition: color 120ms; }
  nav.top .links a:hover { color: var(--coral); }
  nav.top .brand {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Manrope', sans-serif;
    font-size: 26px; font-weight: 800;
    letter-spacing: -0.035em;
    color: var(--ink);
    text-decoration: none;
  }
  nav.top .brand .mark {
    display: inline-flex; align-items: center; justify-content: center;
  }
  nav.top .brand .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--coral);
    margin-left: -2px; align-self: flex-end;
    transform: translateY(-3px);
  }

  .hero {
    background: var(--navy);
    color: var(--paper);
    position: relative;
    overflow: hidden;
  }
  .hero h1 {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: clamp(48px, 5.6vw, 84px);
    line-height: 1.02;
    letter-spacing: -0.038em;
    margin: 0;
  }
  .hero h1 .accent { color: var(--coral); }
  .hero h1 .strike { position: relative; display: inline-block; }
  .hero h1 .strike::after {
    content: ""; position: absolute; left: -2%; right: -2%; top: 54%;
    height: 0.08em; background: var(--coral); transform: rotate(-3deg);
  }
  .hero .lede {
    max-width: 540px;
    font-size: 18px;
    line-height: 1.55;
    color: rgba(255,255,255,0.78);
    margin-top: 28px;
    font-weight: 400;
  }

  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px;
    background: rgba(255,255,255,0.08);
    color: var(--paper);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .chip.light {
    background: var(--paper-2); color: var(--ink-soft);
    border-color: var(--line);
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--coral); }

  .breach-banner {
    background: var(--coral);
    padding: 16px 0;
    overflow: hidden;
    color: var(--paper);
    border-top: 1px solid rgba(0,0,0,0.08);
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .marquee {
    display: flex; gap: 56px;
    white-space: nowrap;
    animation: scroll 60s linear infinite;
    font-family: 'Manrope', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .marquee span { display: inline-flex; align-items: center; gap: 16px; }
  .marquee .star {
    width: 8px; height: 8px;
    background: var(--paper);
    border-radius: 50%;
    flex-shrink: 0;
  }
  @keyframes scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  section.s {
    padding: 120px 0;
    position: relative;
  }
  section.s + section.s { border-top: 1px solid var(--line); }
  .section-head {
    text-align: center;
    max-width: 880px;
    margin: 0 auto 80px;
  }
  .section-head .eyebrow { display: block; margin-bottom: 18px; }
  .section-head h2 {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: clamp(40px, 5.4vw, 72px);
    line-height: 1.04;
    letter-spacing: -0.035em;
    margin: 0;
  }
  .section-head h2 .accent { color: var(--coral); }
  .section-head h2 .serif { font-style: italic; font-weight: 400; }
  .section-head p.sub {
    margin: 22px auto 0;
    max-width: 640px;
    font-size: 18px;
    line-height: 1.55;
    color: var(--ink-soft);
  }

  .card {
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--paper);
    overflow: hidden;
  }

  footer {
    padding: 96px 0 48px;
    background: var(--ink); color: var(--paper);
  }
  footer .grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 48px; }
  footer h4 { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--coral); font-weight: 500; margin: 0 0 18px; }
  footer ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: rgba(255,255,255,0.7); }
  footer ul a { text-decoration: none; }
  footer ul a:hover { color: var(--coral); }
  footer .colophon {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 32px; margin-top: 64px;
    border-top: 1px solid rgba(255,255,255,0.12);
    font-size: 12px; color: rgba(255,255,255,0.5);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.1em;
  }

  @media (max-width: 1000px) {
    .container { padding: 0 24px; }
    nav.top .links { display: none; }
    .hero-grid { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel">
const Glyph = {
  Vault: () => (
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.2">
      <rect x="2" y="3" width="16" height="14" />
      <circle cx="10" cy="10" r="3.5" />
      <circle cx="10" cy="10" r="0.8" fill="currentColor" />
      <line x1="10" y1="6.5" x2="10" y2="4" />
      <line x1="10" y1="13.5" x2="10" y2="16" />
      <line x1="6.5" y1="10" x2="4" y2="10" />
      <line x1="13.5" y1="10" x2="16" y2="10" />
    </svg>
  ),
  Lock: () => (
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.2">
      <rect x="4" y="9" width="12" height="9" />
      <path d="M6.5 9 V6.5 a3.5 3.5 0 0 1 7 0 V9" />
      <circle cx="10" cy="13.5" r="0.8" fill="currentColor" />
    </svg>
  ),
  Message: () => (
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.2">
      <rect x="2.5" y="4" width="15" height="11" />
      <path d="M2.5 4 L10 11 L17.5 4" />
    </svg>
  ),
  Signal: () => (
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.2">
      <path d="M3 13 L7 9 L11 12 L17 5" />
      <circle cx="3" cy="13" r="0.9" fill="currentColor" stroke="none" />
      <circle cx="17" cy="5" r="0.9" fill="currentColor" stroke="none" />
    </svg>
  ),
  Megaphone: () => (
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.2">
      <path d="M3 8 L3 12 L8 12 L15 16 L15 4 L8 8 Z" />
      <line x1="17" y1="9" x2="18.5" y2="9" />
    </svg>
  ),
  Plug: () => (
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.2">
      <path d="M7 2 V6 M13 2 V6" />
      <rect x="5" y="6" width="10" height="5" />
      <path d="M10 11 V15" />
      <rect x="7" y="15" width="6" height="3" />
    </svg>
  ),
  Mark: () => (
    <svg width="22" height="26" viewBox="0 0 120 140" fill="none" aria-label="GradeVault padlock">
      <path d="M 36 56 V 42 a 24 24 0 0 1 48 0 V 56 H 70 V 42 a 10 10 0 0 0 -20 0 V 56 Z" fill="#0a1d3f" />
      <rect x="18" y="56" width="84" height="74" rx="14" fill="#0a1d3f" />
      <circle cx="60" cy="93" r="19" fill="#ffffff" />
      <circle cx="60" cy="93" r="11" fill="#0a1d3f" />
      <rect x="60" y="86" width="22" height="14" fill="#0a1d3f" />
      <rect x="60" y="91" width="14" height="5" fill="#e23f3a" />
      <rect x="69" y="91" width="5" height="9" fill="#ffffff" />
    </svg>
  ),
};

const { useState, useEffect, useRef, useMemo } = React;

const CHARS = '0123456789ABCDEF!@#$%^&*<>+=/\\?abcdef'.split('');

window.__glitchPool = window.__glitchPool || new Set();

function extractText(node) {
  if (node == null || typeof node === 'boolean') return '';
  if (typeof node === 'string') return node;
  if (typeof node === 'number') return String(node);
  if (Array.isArray(node)) return node.map(extractText).join('');
  if (node && typeof node === 'object' && node.props) return extractText(node.props.children);
  return '';
}

function Glitch({ children }) {
  const text = extractText(children) || null;
  const [scrambled, setScrambled] = useState(null);
  const [inView, setInView] = useState(false);
  const ref = useRef(null);
  const timer = useRef(null);
  const finalTimer = useRef(null);

  useEffect(() => {
    if (!ref.current) return;
    const io = new IntersectionObserver(
      (entries) => { for (const e of entries) setInView(e.isIntersecting); },
      { threshold: 0.1 }
    );
    io.observe(ref.current);
    return () => io.disconnect();
  }, []);

  useEffect(() => {
    if (text == null || !inView) return;
    const fire = () => {
      if (timer.current) clearInterval(timer.current);
      if (finalTimer.current) clearTimeout(finalTimer.current);
      let frames = 0;
      const total = 8 + Math.floor(Math.random() * 4);
      timer.current = setInterval(() => {
        frames++;
        const reveal = frames / total;
        const next = text.split('').map((c) => {
          if (c === ' ') return ' ';
          if (Math.random() < reveal * 0.6) return c;
          return CHARS[Math.floor(Math.random() * CHARS.length)];
        }).join('');
        setScrambled(next);
        if (frames >= total) {
          clearInterval(timer.current);
          finalTimer.current = setTimeout(() => setScrambled(null), 60);
        }
      }, 60);
    };
    window.__glitchPool.add(fire);
    return () => {
      window.__glitchPool.delete(fire);
      if (timer.current) clearInterval(timer.current);
      if (finalTimer.current) clearTimeout(finalTimer.current);
    };
  }, [text, inView]);

  if (scrambled !== null) {
    return (
      <span ref={ref} className="glitch is-glitching" style={{
        display: 'inline-block', fontFamily: 'JetBrains Mono, monospace',
        fontStyle: 'normal', letterSpacing: '0.02em',
      }}>{scrambled}</span>
    );
  }
  return <span ref={ref} style={{ display: 'inline' }}>{children}</span>;
}

function TopNav() {
  return (
    <nav className="top">
      <div className="container">
        <div className="row">
          <a className="brand" href="#">
            <span className="mark"><Glyph.Mark /></span>
            <span>GradeVault</span>
            <span className="dot"></span>
          </a>
          <div className="links">
            <a href="#problem">Why GradeVault</a>
            <a href="#how">How it works</a>
            <a href="#features">Features</a>
            <a href="#integrations">Integrations</a>
            <a href="#security">Security</a>
          </div>
          <a href="#sign" className="btn" style={{ padding: '11px 22px', fontSize: 14 }}>
            Pledge your school
          </a>
        </div>
      </div>
    </nav>
  );
}

function Hero() {
  return (
    <section className="hero">
      <div className="container" style={{ padding: '88px 32px 96px', position: 'relative' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1.05fr 1fr', gap: 64, alignItems: 'center' }} className="hero-grid">
          <div>
            <h1>
              Your <Glitch>grades</Glitch> aren't a<br />
              <span className="strike">database</span>. They're a<br />
              <span className="accent"><Glitch>vault</Glitch>.</span>
            </h1>

            <p className="lede">
              GradeVault is an end-to-end encrypted academic records and LMS continuity layer.
              It protects grades, secures faculty–student communication, and keeps courses
              running when the LMS goes <Glitch>dark</Glitch>.
            </p>

            <div style={{ display: 'flex', gap: 14, marginTop: 36, flexWrap: 'wrap', alignItems: 'center' }}>
              <a href="#sign" className="btn btn-coral">
                Pledge your institution →
              </a>
              <a href="#how" className="btn btn-on-dark">
                See how it works
              </a>
            </div>

            <div style={{ marginTop: 56, paddingTop: 24, borderTop: '1px solid rgba(255,255,255,0.14)', display: 'flex', gap: 36, flexWrap: 'wrap' }}>
              <Pill label="247" sub="institutions pledged" />
              <Pill label="14" sub="state systems endorsed" />
              <Pill label="3.2M" sub="students represented" />
            </div>
          </div>
          <HeroComposition />
        </div>
      </div>
    </section>
  );
}

function Pill({ label, sub }) {
  return (
    <div>
      <div style={{ fontFamily: 'Manrope', fontWeight: 800, fontSize: 36, letterSpacing: '-0.03em', lineHeight: 1, color: 'var(--paper)' }}>{label}</div>
      <div className="mono" style={{ fontSize: 11, marginTop: 8, color: 'rgba(255,255,255,0.6)', letterSpacing: '0.16em', textTransform: 'uppercase' }}>{sub}</div>
    </div>
  );
}

function HeroComposition() {
  return (
    <div style={{ position: 'relative', minHeight: 540 }}>
      <div style={{
        position: 'absolute', top: 30, right: -20, width: 380, height: 380,
        background: 'var(--coral)', borderRadius: '50%', opacity: 0.95,
      }} />
      <div style={{
        position: 'absolute', top: 240, right: 220, width: 220, height: 220,
        background: 'var(--coral)', borderRadius: '50%', opacity: 0.55,
      }} />
      <div style={{
        position: 'absolute', top: 80, right: 280, width: 130, height: 130,
        background: 'var(--coral)', borderRadius: '50%', opacity: 0.35,
      }} />

      <div style={{
        position: 'absolute', top: 60, right: 30, width: 'min(440px, 92%)',
        borderRadius: 16, overflow: 'hidden',
        background: 'var(--ink)', color: 'var(--paper)',
        boxShadow: '0 30px 60px -20px rgba(0,0,0,0.55)',
        border: '1px solid rgba(255,255,255,0.08)',
      }}>
        <KeyPanelCompact />
      </div>

    </div>
  );
}

function KeyPanelCompact() {
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setTick(t => t + 1), 1500);
    return () => clearInterval(id);
  }, []);
  const fingerprint = useMemo(() => {
    const hex = '0123456789abcdef';
    let s = '';
    for (let i = 0; i < 32; i++) s += hex[Math.floor(Math.random() * 16)];
    return s.match(/.{1,4}/g).join(' ');
  }, [tick]);

  return (
    <>
      <div style={{ padding: '14px 20px', borderBottom: '1px solid rgba(255,255,255,0.08)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
          <span style={{ width: 8, height: 8, borderRadius: '50%', background: '#3ddc84', boxShadow: '0 0 12px #3ddc84' }} />
          <span className="mono" style={{ fontSize: 11, letterSpacing: '0.16em', textTransform: 'uppercase', color: '#3ddc84' }}>Session key · live</span>
        </div>
        <span className="mono" style={{ fontSize: 10, color: 'rgba(255,255,255,0.5)', letterSpacing: '0.08em' }}>X25519 · AES-256-GCM</span>
      </div>
      <div style={{ padding: '22px 20px 20px' }}>
        <div className="mono" style={{ fontSize: 10, color: 'rgba(255,255,255,0.5)', letterSpacing: '0.16em', marginBottom: 8, textTransform: 'uppercase' }}>Fingerprint</div>
        <div className="mono" style={{ fontSize: 13, color: '#3ddc84', wordBreak: 'break-all', marginBottom: 22, lineHeight: 1.6 }}>{fingerprint}</div>

        <div className="mono" style={{ fontSize: 10, color: 'rgba(255,255,255,0.5)', letterSpacing: '0.16em', marginBottom: 10, textTransform: 'uppercase' }}>Key holders</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 7 }}>
          <KeyRow label="student@uni.edu" status="held" />
          <KeyRow label="prof.lin@uni.edu" status="held" />
          <KeyRow label="recovery.officer@uni.edu" status="sealed" />
          <KeyRow label="canvas.lms.platform" status="denied" />
        </div>
      </div>
    </>
  );
}

function KeyRow({ label, status }) {
  const colors = { held: '#3ddc84', sealed: '#d8a541', denied: '#e23f3a' };
  const txt = { held: 'HELD', sealed: 'SEALED', denied: 'DENIED' };
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12.5 }}>
      <span style={{ color: 'rgba(255,255,255,0.85)' }} className="mono">{label}</span>
      <span style={{ color: colors[status], fontFamily: 'JetBrains Mono', fontSize: 10.5, letterSpacing: '0.12em' }}>● {txt[status]}</span>
    </div>
  );
}

function BreachMarquee() {
  const items = [
    'CANVAS BREACH · MAY 2026',
    'GRADES LEAKED IN PLAINTEXT',
    'TRANSCRIPTS · DMs · ACCOMMODATION RECORDS',
    'NEVER AGAIN',
    'GRADEVAULT INITIATIVE OPEN FOR SIGNATORIES',
  ];
  const all = [...items, ...items, ...items];
  return (
    <div className="breach-banner">
      <div className="marquee">
        {all.map((t, i) => (
          <span key={i}><span className="star"></span>{t}</span>
        ))}
      </div>
    </div>
  );
}

function BreachSection() {
  return (
    <section className="s" id="problem" style={{ background: 'var(--paper-2)' }}>
      <div className="container">
        <div className="section-head">
          <span className="eyebrow">§ I — Before we talk crypto…</span>
          <h2>
            <Glitch>Plaintext</Glitch> grades were never going to age well.<br />
            May <span className="accent"><Glitch>only</Glitch></span> made it visible.
          </h2>
          <p className="sub">
            Schools weren't careless. The LMS architecture asks them to trust a single vendor
            with a complete plaintext copy of every grade, message, and accommodation note ever recorded.
          </p>
        </div>

function DBView({ mode }) {
  const rows = [
    { id: '23814', student: 'A. Park',       course: 'CS 240',   grade: 'A−' },
    { id: '23815', student: 'M. Okafor',     course: 'CS 240',   grade: 'B+' },
    { id: '23816', student: 'L. Hernández',  course: 'PHIL 110', grade: 'A'  },
    { id: '23817', student: 'S. Ito',        course: 'BIO 305',  grade: 'C'  },
  ];
  const cipher = (seed) => {
    let s = ''; const hex = '0123456789abcdef';
    for (let i = 0; i < 24; i++) s += hex[(seed * (i + 7)) % 16];
    return s;
  };
  return (
    <div style={{ background: 'var(--paper)' }}>
      <div style={{ display: 'grid', gridTemplateColumns: '70px 1fr 1fr 80px', padding: '12px 22px', borderBottom: '1px solid var(--line)' }}>

        ))}
      </div>
      {rows.map((r, i) => (
        <div key={r.id} style={{ display: 'grid', gridTemplateColumns: '70px 1fr 1fr 80px', alignItems: 'center', padding: '14px 22px', borderBottom: '1px solid var(--line)', fontSize: 13 }}>
          <span className="mono" style={{ color: 'var(--ink-soft)' }}>{r.id}</span>
          <span style={{ color: 'var(--ink)', fontFamily: mode === 'lms' ? 'Manrope' : 'JetBrains Mono', fontSize: mode === 'lms' ? 14 : 12, fontWeight: mode === 'lms' ? 500 : 400 }}>
            {mode === 'lms' ? r.student : cipher(i + 3)}
          </span>
          <span style={{ color: 'var(--ink)', fontFamily: mode === 'lms' ? 'Manrope' : 'JetBrains Mono', fontSize: mode === 'lms' ? 14 : 12 }}>
            {mode === 'lms' ? r.course : cipher(i + 11)}
          </span>
          <span style={{ color: mode === 'lms' ? 'var(--ink)' : 'var(--coral)', fontWeight: 600, fontFamily: mode === 'lms' ? 'Manrope' : 'JetBrains Mono', fontSize: mode === 'lms' ? 16 : 12 }}>
            {mode === 'lms' ? r.grade : cipher(i + 19).slice(0, 6)}
          </span>
        </div>
      ))}
      <div style={{ padding: '14px 22px', fontSize: 12, color: 'var(--ink-soft)', fontFamily: 'JetBrains Mono' }}>
        + 23 813 more rows…
      </div>
    </div>
  );
}

  React.useEffect(() => {
    const id = setInterval(() => {
      const arr = Array.from(window.__glitchPool || []);
      if (!arr.length) return;
      const fire = arr[Math.floor(Math.random() * arr.length)];
      fire();
    }, 3000);
    return () => clearInterval(id);
  }, []);

  return (
    <React.Fragment>
      <TopNav />
      <Hero />
      <BreachMarquee />
      <BreachSection />
      <HowSection />
      <PledgeSection />
      <FAQSection />
      <Footer />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
